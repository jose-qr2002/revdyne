<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:">
<title>Cargando…</title>
<style>
  :root { --bg:#0f0f13; --border:#2a2a38; --accent:#ff0050; --text:#eeeef2; --text2:#9999b0; --text3:#555570; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    overflow: hidden; user-select: none; -webkit-app-region: drag;
  }
  .mark-img { width: 72px; height: 72px; object-fit: contain; }
  h1 { font-size: 20px; letter-spacing: 4px; font-weight: 800; }
  .bar { position: relative; width: 180px; height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
    background: var(--accent); border-radius: 3px; animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }
  #status { font-size: 12px; color: var(--text2); min-height: 16px; }
  #ver { position: absolute; bottom: 10px; font-size: 11px; color: var(--text3); }
</style>
</head>
<body>
  <img class="mark-img" src="splash-icon.png" alt="">
  <h1 id="name">…</h1>
  <div class="bar"></div>
  <div id="status">Iniciando…</div>
  <div id="ver"></div>
<script>
  const p = new URLSearchParams(location.search);
  const name = p.get('n') || 'App';
  document.getElementById('name').textContent = name.toUpperCase();
  if (p.get('v')) document.getElementById('ver').textContent = 'v' + p.get('v');
  window.__setStatus = (t) => { document.getElementById('status').textContent = t; };
</script>
</body>
</html>
